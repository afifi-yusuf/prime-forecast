# Smoke run: validate the full loop (secrets, live tools, reward curves) cheaply.
# Submit with:  prime train run configs/rl/prime-forecast-9b.toml
# Prereq: prime env push (from environments/prime_forecast) and update [[env]] id below.

# Verify exact model id with `prime train models` (Qwen3.5 family) after login.
model = "Qwen/Qwen3.5-9B"
# Tiny Exa smoke: 20*16*4*1 = 1280 searches ≈ $9 at $7/1k (fits ~$15 Exa; G must divide batch).
max_steps = 20
batch_size = 16
rollouts_per_example = 4
env_file = ["../../secrets.env"]

[sampling]
max_tokens = 4096
enable_thinking = false

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 8, max_web_searches = 1, include_market_tools = true }

# Dead-group guard: drop zero-advantage rollout groups (crowd-price copying /
# uniform rewards were the main haruspex failure mode).
[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 16
rollouts_per_example = 1
interval = 10

# Optional: add WANDB_API_KEY to secrets.env and uncomment
# [wandb]
# project = "prime-forecast"
# name = "9b-smoke"

[checkpoints]
interval = 25

[adapters]
interval = 0  # upload adapter at run end
