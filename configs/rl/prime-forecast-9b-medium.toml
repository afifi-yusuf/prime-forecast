# Medium run after 9B smoke: raise steps, keep Exa spend bounded.
# Submit with:  prime train run configs/rl/prime-forecast-9b-medium.toml
# Prereq: Hub env ≥0.1.7, Bedrock bearer refreshed on Hub, Exa key set.

model = "Qwen/Qwen3.5-9B"
# 50 * 32 * 4 * ~2 searches ≈ 12.8k Exa calls (budget-check before launch).
max_steps = 50
batch_size = 32
rollouts_per_example = 4
env_file = ["../../secrets.env"]

[sampling]
max_tokens = 3072
enable_thinking = false

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 8, max_web_searches = 2, include_market_tools = true, crowd_copy_penalty = 0.20, crowd_copy_eps = 0.02 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 32
rollouts_per_example = 1
interval = 10

# Optional: add WANDB_API_KEY to secrets.env and uncomment
# [wandb]
# project = "prime-forecast"
# name = "9b-medium"

[checkpoints]
interval = 25

[adapters]
interval = 0  # upload adapter at run end
