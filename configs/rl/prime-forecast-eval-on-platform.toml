# Eval-on-platform probe: load the main run's step-30 checkpoint and evaluate
# the TEST split through Prime's own inference stack (skip_first_step=false
# runs the eval before any training). Trains only the single mandatory step
# at minimal batch size. Purpose: measure the trained policy's held-out
# behavior in the exact serving environment used during training, resolving
# the training-vs-local-serving behavior gap.
# Submit with:  prime train run configs/rl/prime-forecast-eval-on-platform.toml

model = "Qwen/Qwen3.5-35B-A3B"
checkpoint_id = "fn68s0t1zoi7mkmdg5fo4nm0"  # main run step 30
max_steps = 31
batch_size = 16
rollouts_per_example = 8
env_file = ["../../secrets.env", "../../eval-searxng.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 8, max_web_searches = 2, include_market_tools = true, crowd_copy_penalty = 0.20, crowd_copy_eps = 0.02 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[eval]
interval = 1
skip_first_step = false  # evaluate the loaded checkpoint BEFORE training

[[eval.env]]
id = "yafifi/prime-forecast"
args = { split = "test", eval_split = "test", max_turns = 8, max_web_searches = 2, include_market_tools = true }
num_examples = 160
rollouts_per_example = 1

[checkpoints]
interval = 31

[adapters]
interval = 0
