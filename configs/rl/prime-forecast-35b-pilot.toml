# 35B pilot: validate thinking-mode behavior, token budget, and reward curves
# before committing to a Firecrawl credit top-up for the main run.
# Budget: 16 steps x 32 x 8 = 4096 rollouts + 2 vals ~= 6.2k Firecrawl credits
# at the observed ~1.5 searches/rollout (fits the remaining ~7.4k).
# Submit with:  prime train run configs/rl/prime-forecast-35b-pilot.toml

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 16
batch_size = 32
rollouts_per_example = 8
env_file = ["../../secrets.env"]

[sampling]
max_tokens = 12288  # thinking + up to 8 tool turns
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 8, max_web_searches = 2, include_market_tools = true, crowd_copy_penalty = 0.20, crowd_copy_eps = 0.02 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 16
rollouts_per_example = 1
interval = 8

[checkpoints]
interval = 8

[adapters]
interval = 0  # upload adapter at run end
