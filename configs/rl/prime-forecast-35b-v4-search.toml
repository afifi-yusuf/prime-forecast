# v4 run: retrieval-in-the-loop WITH WORKING SEARCH (Google CSE API chain,
# env 0.1.17). Identical to v3 (no market tools, pure Brier, single epoch)
# except search actually returns results — v3 is the matched dead-search
# control. THE thesis experiment: can RLVR learn to research?
# Search: chain searxng,google_cse,tavily,brave; CSE billed to GCP credits
# (10k/day cap; run spans quota reset; overflow degrades gracefully).
# Submit with:  prime train run configs/rl/prime-forecast-35b-v4-search.toml

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 33
batch_size = 64
rollouts_per_example = 8
env_file = ["../../secrets.env", "../../eval-searxng.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 10, max_web_searches = 3, include_market_tools = false }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 32
rollouts_per_example = 1
interval = 11

[eval]
interval = 33
skip_first_step = false  # step-0 eval = base model in the matched no-market condition

[[eval.env]]
id = "yafifi/prime-forecast"
args = { split = "test", eval_split = "test", max_turns = 10, max_web_searches = 3, include_market_tools = false }
num_examples = 265
rollouts_per_example = 1

[checkpoints]
interval = 11
keep_cloud = -1

[adapters]
interval = 11
keep_last = -1
