# Base-model tools-off eval: the untrained baseline for the standalone-skill delta.
# skill with the crowd-price tools hidden. Warm-starts the v2 step-22
# checkpoint (last uploadable artifact; policy already at 100% submit /
# near-final Brier by step 22) and evaluates BEFORE the single mandatory
# training step. Compare against base-tools-off (separate probe).
# Submit with:  prime train run configs/rl/prime-forecast-eval-v2-notools.toml

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 1
batch_size = 16
rollouts_per_example = 8
env_file = ["../../secrets.env", "../../eval-searxng.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 10, max_web_searches = 3, include_market_tools = true, crowd_copy_penalty = 0.15, crowd_copy_eps = 0.08 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[eval]
interval = 1
skip_first_step = false  # evaluate the loaded checkpoint BEFORE training

[[eval.env]]
id = "yafifi/prime-forecast"
args = { split = "test", eval_split = "test", max_turns = 10, max_web_searches = 3, include_market_tools = false }
num_examples = 265
rollouts_per_example = 1

[checkpoints]
interval = 1

[adapters]
interval = 0
