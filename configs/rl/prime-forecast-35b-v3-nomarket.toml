# v3 run: NO MARKET TOOLS during training (and matched eval condition).
# Tests the causal question behind the v2 flat-resolution null: does removing
# the crowd-anchor shortcut let RLVR learn evidence-based forecasting?
# Everything else frozen at v2: dataset v4 single epoch, SearXNG, webhook.
# Reward is pure Brier (crowd-copy penalty removed — the policy cannot see
# the price, so proximity penalties would be pure noise).
# Est: ~17k rollouts ~= $40 Prime. Search $0 (SearXNG on Azure VM).
# Submit with:  prime train run configs/rl/prime-forecast-35b-v3-nomarket.toml

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 33
batch_size = 64
rollouts_per_example = 8
env_file = ["../../secrets.env", "../../eval-searxng.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 10, max_web_searches = 3, include_market_tools = false }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 32
rollouts_per_example = 1
interval = 11

[eval]
interval = 33
skip_first_step = false  # step-0 eval = base model in the matched no-market condition

[[eval.env]]
id = "yafifi/prime-forecast"
args = { split = "test", eval_split = "test", max_turns = 10, max_web_searches = 3, include_market_tools = false }
num_examples = 265
rollouts_per_example = 1

[checkpoints]
interval = 11
keep_cloud = -1

[adapters]
interval = 11
keep_last = -1
