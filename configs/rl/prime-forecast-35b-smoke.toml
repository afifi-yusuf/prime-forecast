# 35B smoke ONLY after 9B medium gate: submit≥80%, truncation≪20%.
# Submit with:  prime train run configs/rl/prime-forecast-35b-smoke.toml
# Do NOT run the full prime-forecast-35b.toml until this smoke looks healthy.

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 25
batch_size = 16
rollouts_per_example = 4
env_file = ["../../secrets.env"]

[sampling]
max_tokens = 3072
enable_thinking = false

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 8, max_web_searches = 2, include_market_tools = true, crowd_copy_penalty = 0.20, crowd_copy_eps = 0.02 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 16
rollouts_per_example = 1
interval = 10

# Optional: add WANDB_API_KEY to secrets.env and uncomment
# [wandb]
# project = "prime-forecast"
# name = "35b-smoke"

[checkpoints]
interval = 25

[adapters]
interval = 0
