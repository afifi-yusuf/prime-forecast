# v2 main run: single-epoch over dataset v4 (2,113 train questions), graded
# anti-anchoring penalty (env 0.1.15), SearXNG search (free), full webhook
# instrumentation. 33 steps x batch 64 = exactly one pass; checkpoint
# interval 11 lands on the final step by construction.
# Est: ~17k rollouts ~= $50-55 Prime. Search $0 (SearXNG on Azure VM).
# Submit with:  prime train run configs/rl/prime-forecast-35b-v2.toml

model = "Qwen/Qwen3.5-35B-A3B"
max_steps = 33
batch_size = 64
rollouts_per_example = 8
env_file = ["../../secrets.env", "../../eval-searxng.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 10, max_web_searches = 3, include_market_tools = true, crowd_copy_penalty = 0.15, crowd_copy_eps = 0.08 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 32
rollouts_per_example = 1
interval = 11

[eval]
interval = 33
skip_first_step = false  # baseline eval of the base model at step 0

[[eval.env]]
id = "yafifi/prime-forecast"
args = { split = "test", eval_split = "test", max_turns = 10, max_web_searches = 3, include_market_tools = true }
num_examples = 265
rollouts_per_example = 1

[checkpoints]
interval = 11
keep_cloud = -1

[adapters]
interval = 11
keep_last = -1
