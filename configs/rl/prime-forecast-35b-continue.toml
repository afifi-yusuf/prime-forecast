# Continuation: warm-start from the main run's step-30 checkpoint and re-train
# the final 15 steps. The original run's end-state artifacts were lost to a
# platform pipeline failure (step-40 checkpoint upload died; final checkpoint
# never appeared; exported adapter is functionally inert). Checkpoint interval 5
# lands exactly on the final step so the end state is captured as a normal
# interval checkpoint, independent of the run-end pipeline.
# Submit with:  prime train run configs/rl/prime-forecast-35b-continue.toml

model = "Qwen/Qwen3.5-35B-A3B"
checkpoint_id = "fn68s0t1zoi7mkmdg5fo4nm0"  # main run step 30
max_steps = 15
batch_size = 32
rollouts_per_example = 8
env_file = ["../../secrets.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 8, max_web_searches = 2, include_market_tools = true, crowd_copy_penalty = 0.20, crowd_copy_eps = 0.02 }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[val]
num_examples = 16
rollouts_per_example = 1
interval = 5

[checkpoints]
interval = 5
keep_cloud = -1

[adapters]
interval = 5
keep_last = -1
