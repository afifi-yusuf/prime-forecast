# Missing-cell toggle runs (n=265): within-endpoint search-available vs
# search-absent eval. toggle265-v3naive: warm-start r2z78cz2yelsq4i8yclad20u, train market-off with
# max_web_searches=0, dual eval envs on the packaged test split.
name = "toggle265-v3naive"
model = "Qwen/Qwen3.5-35B-A3B"
checkpoint_id = "r2z78cz2yelsq4i8yclad20u"
max_steps = 33
batch_size = 64
rollouts_per_example = 8
env_file = ["../../secrets.env", "../../eval-searxng.env"]

[sampling]
max_tokens = 12288
enable_thinking = true

[[env]]
id = "yafifi/prime-forecast"
args = { split = "train", max_turns = 10, max_web_searches = 0, include_market_tools = false }

[[pre_batch_filters]]
type = "zero_advantage"
enforce = true

[eval]
interval = 33
skip_first_step = true

[[eval.env]]
id = "yafifi/prime-forecast"
name = "test-marketoff-search"
args = { split = "test", eval_split = "test", max_turns = 10, max_web_searches = 3, include_market_tools = false }
num_examples = 265
rollouts_per_example = 1

[[eval.env]]
id = "yafifi/prime-forecast"
name = "test-marketoff-nosearch"
args = { split = "test", eval_split = "test", max_turns = 10, max_web_searches = 0, include_market_tools = false }
num_examples = 265
rollouts_per_example = 1

[checkpoints]
interval = 100

[adapters]
interval = 100
